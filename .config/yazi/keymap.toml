[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = 'shell "lazygit" --block'
desc = "Open lazygit"

[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin fzf"
desc = "Jump to a file/directory via fzf"

[[mgr.prepend_keymap]]
on   = "Z"
run  = "plugin zoxide"
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on   = [ "C", "z" ]
run  = "shell --block -- ~/.config/yazi/scripts/archive zip %s"
desc = "Compress selected files to ZIP"

[[mgr.prepend_keymap]]
on   = [ "C", "7" ]
run  = "shell --block -- ~/.config/yazi/scripts/archive 7z %s"
desc = "Compress selected files to 7z"

[[mgr.prepend_keymap]]
on   = [ "C", "t" ]
run  = "shell --block -- ~/.config/yazi/scripts/archive tar %s"
desc = "Compress selected files to tar.gz"

[[mgr.prepend_keymap]]
on   = [ "g", "f" ]
run  = 'search_do --via=fd --args="-d 3 --hidden --no-ignore"'
desc = "Flat view, max depth 3"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Go Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Pictures"
desc = "Go Pictures"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/Source"
desc = "Go Source"

[[mgr.prepend_keymap]]
on   = [ "g", "w" ]
run  = "cd ~/Documents/Wiki"
desc = "Go Wiki"

[[mgr.prepend_keymap]]
on   = [ "g", "x" ]
run  = "cd ~/.pi/agent/extensions"
desc = "Go Pi extensions"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Go Documents"
