experimental_monorepo_root = true

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["ruby"]
all_compile = false
minimum_release_age_excludes = ["codex", "npm:@anthropic-ai/claude-code", "npm:@earendil-works/pi-coding-agent"]

[env]
HK_MISE = "1"

# pi-prompt-template-model expects a pi-subagents runtime root containing agents.ts.
# Pi user packages installed via `pi install npm:*` live under the Pi agent dir,
# independent of the active project Node version.
PI_CODING_AGENT_DIR = "{{ env.HOME }}/.pi/agent"
PI_SUBAGENT_RUNTIME_ROOT = "{{ env.PI_CODING_AGENT_DIR }}/npm/node_modules/pi-subagents/src/agents"

[settings.ruby]
compile = false

[settings.python]
compile = false
precompiled_flavor = "install_only"

[settings.npm]
package_manager = "npm"

[tools]
node = "lts"
yarn = "1.22.19"
ruby = "latest"
golang = 'latest'
python = 'latest'

# Others
codex = "latest"
fnox = "latest"
hk = "latest"
pkl = "latest"
shellcheck = "latest"
usage = "latest"

# NPM Tools
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:@devcontainers/cli" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@tobilu/qmd" = "latest"
"npm:agent-browser" = "latest"
"npm:cf" = "latest"
"npm:pnpm" = "latest"
"npm:sentry" = "latest"

# LSP & Lint
"npm:@herb-tools/formatter" = "latest"
"npm:@herb-tools/language-server" = "latest" 
"npm:@stylelint/language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:prettier" = "latest"
# stimulus-language-server bundles @herb-tools/core, which requires @ruby/prism
# but does not declare it as a dependency. Install it here and expose it via
# NODE_PATH in the nvim stimulus_ls cmd so the server can load.
"npm:@ruby/prism" = "latest"
"npm:stimulus-language-server" = "latest"
"npm:svelte-language-server" = "latest"
"npm:typescript-language-server" = "latest"
"npm:yaml-language-server" = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
