# /home/hschne/.config/tmuxinator/apollonia.yml

name: rubyevents
root: ~/Source/rubyevents

windows:
  - editor:
      panes:
        - vim: nvim
  - pi:
      panes:
        - pi: pi
  - console:
      layout: even-vertical
      panes:
        - console: bundle exec rails console
        - shell: # shell
        - server: bin/dev
  - background:
      layout: tiled
      panes:
        ranger: yazi .
